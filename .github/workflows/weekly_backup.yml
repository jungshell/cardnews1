name: Weekly Backup

on:
  schedule:
    # 매주 월요일 00:00 KST = 일요일 15:00 UTC
    - cron: '0 15 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backup archive
        run: |
          BACKUP_NAME="cardnews_3_backup_${{ github.run_id }}.tar.gz"
          tar \
            --exclude=".git" \
            --exclude="venv" \
            --exclude=".venv" \
            --exclude="__pycache__" \
            --exclude="cache" \
            --exclude="logs" \
            --exclude="*.log" \
            --exclude="streamlit.log" \
            --exclude="streamlit.pid" \
            --exclude="*.zip" \
            -czf "$BACKUP_NAME" .
          echo "BACKUP_NAME=$BACKUP_NAME" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}
          retention-days: 90
